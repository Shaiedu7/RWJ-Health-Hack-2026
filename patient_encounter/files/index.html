<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patient Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
:root{--bg:#EDF1F2;--s:#fff;--ink:#14262B;--mut:#5B6E73;--line:#D3DCDE;--acc:#0E6F73;--crit:#B3261E;--warn:#9A5B00;--ok:#1F7A3E}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Public Sans",sans-serif}
h1,h2,h3{font-family:Newsreader,serif;font-weight:600;margin:0}h1{font-size:30px}h2{font-size:22px}
header{background:var(--ink);color:#fff;display:flex;align-items:center;gap:24px;padding:12px 28px}header b{font:600 20px Newsreader,serif;margin-right:auto}
header button{background:none;border:0;color:#B9CDD1;font:inherit;cursor:pointer;padding:6px 2px;border-bottom:2px solid transparent}header button.on{color:#fff;border-color:#5fd0d0}
main{max-width:1080px;margin:28px auto;padding:0 20px}.card{background:var(--s);border:1px solid var(--line);border-radius:6px;padding:20px;margin-bottom:16px}
button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:6px;padding:7px 14px}
button.ghost{background:none;color:var(--acc)}button.x{background:none;border-color:transparent;color:var(--crit);padding:4px 8px}button:disabled{opacity:.5;cursor:wait}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;width:100%}:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
textarea{resize:vertical}.f{display:block;margin-bottom:14px}.f>span{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:13px;margin-bottom:4px}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start;flex-wrap:wrap}.row>input{flex:1 1 140px}.trig{display:flex;gap:6px;flex:2 1 280px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.badge{font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid}.ai{color:var(--warn);border-color:var(--warn)}.ok,.published{color:var(--ok);border-color:var(--ok)}
.draft{color:var(--mut);border-color:var(--mut)}.archived{color:var(--mut);border-color:var(--line)}.critical{color:var(--crit);border-color:var(--crit)}.warning{color:var(--warn);border-color:var(--warn)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--mut);font-weight:500;font-size:13px}
.sec{border:1px solid var(--line);border-radius:6px;padding:0 16px;margin-bottom:12px}.sec summary{cursor:pointer;padding:12px 0;font:600 19px Newsreader,serif}.sec>div{padding:4px 0 8px}
.tabs{flex-wrap:wrap;display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}.tabs button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--mut)}.tabs button.on{color:var(--ink);border-color:var(--acc)}
.err{color:var(--crit);margin:8px 0}.issue{border-left:3px solid var(--crit);padding:8px 12px;margin-bottom:10px;background:#fbf6f5}.issue.warning{border-color:var(--warn);background:#fcf9f2}.issue.dismissed{opacity:.5}
.enc{display:grid;grid-template-columns:3fr 2fr;gap:16px}@media(max-width:760px){.enc{grid-template-columns:1fr}}
.chat{height:420px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}.m{max-width:80%;padding:8px 12px;border-radius:6px;background:#E4ECEE}.m.student{align-self:flex-end;background:var(--acc);color:#fff}
.item{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:8px}.item.new{animation:pop 1.6s ease-out}@keyframes pop{from{background:#c8ecec;transform:scale(1.03)}}
@media(prefers-reduced-motion:reduce){.item.new{animation:none}}.item img{max-width:100%;border-radius:4px;margin-top:6px}.muted{color:var(--mut)}
</style></head><body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;
const api=async(p,{json,form,method}={})=>{const r=await fetch("/api"+p,{method:method||(json||form?"POST":"GET"),headers:{...(json?{"Content-Type":"application/json"}:{}),...(localStorage.token?{Authorization:"Bearer "+localStorage.token}:{})},body:json?JSON.stringify(json):form});
 const j=await r.json().catch(()=>({}));if(r.status===401&&!p.startsWith("/auth/")){localStorage.removeItem("token");location.reload()}if(!r.ok)throw (typeof j.detail==="string"?j.detail:JSON.stringify(j.detail||j));return j;};
const TRIG={start:"Available at start",topic_asked:"After student asks about…",exam_requested:"After student requests exam/test…",after_turns:"After N turns",custom_intent:"Custom intent…"};
const SAMPLE="58-year-old male bus driver with 2 hours of crushing chest pressure radiating to his left arm, sweaty and nauseated. Hypertensive, smokes a pack a day but downplays it. Allergic to penicillin. Anxious, minimizes symptoms. Inferior STEMI is the hidden diagnosis; include amoxicillin on his med list by mistake.";
const mkItem=()=>({id:crypto.randomUUID().slice(0,8),label:"",value:"",trigger:{type:"start"}});

const Trig=({t,on})=><span className="trig"><select aria-label="Release trigger" value={t.type} onChange={e=>on({...t,type:e.target.value})}>{Object.entries(TRIG).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select>
 {t.type!=="start"&&<input aria-label="Trigger value" placeholder={t.type==="after_turns"?"5":"e.g. cardiac history, 12-lead ECG"} value={t.value||""} onChange={e=>on({...t,value:e.target.value})}/>}</span>;
const St=({s})=><span className={"badge "+s}>{s}</span>;

function Login({done}){
 const [reg,setReg]=useState(false),[f,setF]=useState({email:"",password:"",name:"",role:"faculty",code:""}),[e,setE]=useState(""),[busy,setB]=useState(false);
 const s=(k,v)=>setF({...f,[k]:v});
 const go=async()=>{setB(true);setE("");try{const r=await api(reg?"/auth/register":"/auth/login",{json:f});localStorage.token=r.token;done(r.user)}catch(x){setE(String(x));setB(false)}};
 return <div className="card" style={{maxWidth:420,margin:"60px auto"}}><h1 style={{marginBottom:4}}>Patient Studio</h1><p className="muted">{reg?"Create your account.":"Sign in to build or practice with virtual patients."}</p>
 {reg&&<><label className="f"><span>Name</span><input value={f.name} onChange={e=>s("name",e.target.value)}/></label>
 <label className="f"><span>I am a</span><select value={f.role} onChange={e=>s("role",e.target.value)}><option value="faculty">Faculty member</option><option value="student">Student</option></select></label>
 {f.role==="faculty"&&<label className="f"><span>Faculty access code</span><input type="password" value={f.code} onChange={e=>s("code",e.target.value)}/></label>}</>}
 <label className="f"><span>Email</span><input type="email" value={f.email} onChange={e=>s("email",e.target.value)}/></label>
 <label className="f"><span>Password</span><input type="password" value={f.password} onChange={e=>s("password",e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()}/></label>
 {e&&<p className="err">{e}</p>}<button disabled={busy} onClick={go}>{busy?"Please wait…":reg?"Create account":"Sign in"}</button>
 <p><button className="ghost" style={{border:0,padding:0}} onClick={()=>{setReg(!reg);setE("")}}>{reg?"I already have an account":"Create an account"}</button></p></div>;
}
function App(){
 const [v,setV]=useState({n:"lib"}),[u,setU]=useState(undefined);
 useEffect(()=>{localStorage.token?api("/auth/me").then(setU).catch(()=>setU(null)):setU(null)},[]);
 if(u===undefined)return <p className="muted" style={{padding:28}}>Loading…</p>;
 if(!u)return <main><Login done={setU}/></main>;
 const fac=u.role==="faculty";
 const out=async()=>{await api("/auth/logout",{method:"POST"}).catch(()=>{});localStorage.removeItem("token");setU(null);setV({n:"lib"})};
 return <><header><b>Patient Studio</b><button className={v.n==="lib"?"on":""} onClick={()=>setV({n:"lib"})}>{fac?"Patient library":"Practice patients"}</button>{fac&&<button className={v.n==="new"?"on":""} onClick={()=>setV({n:"new"})}>New patient</button>}
 <span style={{marginLeft:"auto",color:"#B9CDD1"}}>{u.name} ({u.role})</span><button onClick={out}>Sign out</button></header>
 <main>{v.n==="lib"&&<Library go={setV} fac={fac}/>}{v.n==="new"&&<Create go={setV}/>}{v.n==="edit"&&<Editor key={v.pid} pid={v.pid} go={setV}/>}{v.n==="enc"&&<Encounter pid={v.pid} go={setV} fac={fac}/>}</main></>;
}

function Library({go,fac}){
 const [rows,setRows]=useState(null);const load=()=>api("/patients").then(setRows);useEffect(()=>{load()},[]);
 const act=async(pid,a)=>{await api(`/patients/${pid}/${a}`,{method:"POST"});load()};
 if(!rows)return <p className="muted">Loading…</p>;
 if(!rows.length)return <div className="card"><h2>No patients yet</h2>{fac?<><p className="muted">Describe a case and Patient Studio will draft the full profile.</p><button onClick={()=>go({n:"new"})}>Create a patient</button></>:<p className="muted">Your faculty have not published any patients yet. Check back soon.</p>}</div>;
 return <div className="card"><h2 style={{marginBottom:12}}>Patient library</h2><table><thead><tr><th>Patient</th><th>Status</th><th>Tags</th><th></th></tr></thead><tbody>
 {rows.map(r=><tr key={r.pid}><td><b>{r.name}</b> <span className="muted">v{r.ver}</span><div className="muted">{r.complaint}</div></td><td><St s={r.status}/></td>
 <td>{[...r.tags,r.difficulty].join(", ")}</td><td style={{textAlign:"right",whiteSpace:"nowrap"}}>
 {fac&&<><button className="ghost" onClick={()=>go({n:"edit",pid:r.pid})}>Open</button> <button className="ghost" onClick={()=>act(r.pid,"duplicate")}>Duplicate</button> <button className="ghost" onClick={()=>act(r.pid,"archive")}>Archive</button></>}
 {r.live&&<> <button onClick={()=>go({n:"enc",pid:r.pid})}>Start encounter</button></>}</td></tr>)}</tbody></table></div>;
}

function Create({go}){
 const [d,setD]=useState(SAMPLE),[busy,setB]=useState(false),[e,setE]=useState("");
 const fr=useRef();const imp=async()=>{if(!fr.current.files[0])return setE("Choose a JSON or CSV file first.");setB(true);setE("");try{const fd=new FormData();fd.append("file",fr.current.files[0]);await api("/patients/import",{form:fd});go({n:"lib"})}catch(x){setE(String(x));setB(false)}};
 const run=async()=>{setB(true);setE("");try{const r=await api("/patients/generate",{json:{description:d}});go({n:"edit",pid:r.pid})}catch(x){setE(String(x));setB(false)}};
 return <div className="card"><h2>New patient</h2><p className="muted">Describe the case in your own words. You will review and correct every generated field next.</p>
 <textarea rows={8} value={d} onChange={e=>setD(e.target.value)} aria-label="Case description"/><div style={{marginTop:12}}><button disabled={busy||!d.trim()} onClick={run}>{busy?"Drafting profile…":"Generate patient profile"}</button></div><hr style={{border:0,borderTop:"1px solid var(--line)",margin:"20px 0"}}/><h3>Import a dataset</h3><p className="muted">Upload a JSON or CSV file with one patient per record (up to 25). Fields are mapped to the profile form for you to review. Nothing is published automatically.</p><div className="row"><input type="file" accept=".json,.csv" ref={fr}/><button className="ghost" disabled={busy} onClick={imp}>{busy?"Importing…":"Import patients"}</button></div>{e&&<p className="err">{e}</p>}</div>;
}

function Editor({pid,go}){
 const [d,setD]=useState(null),[tab,setTab]=useState("profile"),[msg,setMsg]=useState(""),[busy,setB]=useState(false),[dirty,setDirty]=useState(false),[sch,setSch]=useState(null);
 useEffect(()=>{api("/patients/"+pid).then(setD);api("/schema").then(setSch)},[pid]);
 if(!d||!sch)return <p className="muted">Loading…</p>;
 const locked=d.status!=="draft";
 const setP=p=>{setD({...d,profile:p});setDirty(true)};
 const save=async()=>{if(!dirty)return d;const r=await api("/patients/"+pid,{method:"PUT",json:d.profile});setD(r);setDirty(false);return r};
 const wrap=fn=>async(...a)=>{setB(true);setMsg("");try{await save();await fn(...a)}catch(x){setMsg(String(x))}setB(false)};
 const check=wrap(async()=>{const iss=await api(`/patients/${pid}/check`,{method:"POST"});setD(x=>({...x,issues:iss}))});
 const dismiss=wrap(async i=>{const iss=await api(`/patients/${pid}/issues/${i}/dismiss`,{method:"POST"});setD(x=>({...x,issues:iss}))});
 const publish=wrap(async()=>{const r=await api(`/patients/${pid}/publish`,{method:"POST"});setD(r);setMsg("Published. Students can start this encounter now.")});
 const up=wrap(async(path,form)=>{setD(await api(`/patients/${pid}/${path}`,{form}))});
 const p=d.profile;
 return <><div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}><h1>{p.demographics.name||p.overview.title||"Untitled patient"}</h1><St s={d.status}/><span className="muted">v{d.ver}</span>
  <span style={{marginLeft:"auto"}}><button className="ghost" disabled={busy||!dirty} onClick={wrap(async()=>{})}>{dirty?"Save changes":"Saved"}</button></span></div>
  {locked&&<p className="card muted">This version is {d.status}. Saving any change creates a new draft version; the published one stays untouched for students.</p>}
  <div className="tabs">{[["profile","Profile"],["artifacts","Artifacts"],["knowledge","Knowledge"],["check","Check & publish"]].map(([k,l])=><button key={k} className={tab===k?"on":""} onClick={()=>setTab(k)}>{l}</button>)}</div>
  <div className="card">
  {tab==="profile"&&<Profile p={p} setP={setP} schema={sch}/>}
  {tab==="artifacts"&&<Artifacts p={p} setP={setP} up={up} busy={busy}/>}
  {tab==="knowledge"&&<Knowledge p={p} up={up} busy={busy}/>}
  {tab==="check"&&<Check d={d} check={check} dismiss={dismiss} publish={publish} busy={busy} go={go} save={save}/>}
  {msg&&<p className={msg.startsWith("Published")?"":"err"}>{msg}</p>}</div></>;
}

const LONG=/summary|hpi|history|review|intake|concerns|notes|stressors|support|beliefs|mood|statement|personality|style|adherence|diet|reaction|indication/;
function Profile({p,setP,schema}){
 const defs=schema.$defs||{},ver=p._verified||[];
 const deref=s0=>{const s=s0.allOf?s0.allOf[0]:s0;const d=s.$ref?defs[s.$ref.split("/").pop()]:s;return {...d,title:s0.title||s.title||d.title}};
 const blank=s0=>{const s=deref(s0);if(s.properties)return Object.fromEntries(Object.entries(s.properties).map(([k,v])=>[k,k==="id"?crypto.randomUUID().slice(0,8):k==="trigger"?{type:"start",value:""}:blank(v)]));
  return s.type==="array"?[]:s.enum?s.enum[0]:s.type==="string"?"":0};
 const setAt=(path,val)=>{const n=JSON.parse(JSON.stringify(p));let o=n;path.slice(0,-1).forEach(k=>o=o[k]);o[path[path.length-1]]=val;
  n._verified=[...new Set([...(n._verified||[]),path.slice(0,2).join(".")])];setP(n)};
 const Field=(k,s0,v,path)=>{
  const s=deref(s0),lab=(s.title||k).replace(/_/g," "),id=path.slice(0,2).join("."),on=ver.includes(id);
  const wrap=body=><div className="f" key={path.join(".")}><span>{lab}{path.length===2&&<span className={"badge "+(on?"ok":"ai")}>{on?"Faculty-verified":"AI-generated"}</span>}</span>{body}</div>;
  const sel=(o,val,fn,key)=><select key={key} value={val} onChange={e=>fn(e.target.value)}>{o.map(x=><option key={x} value={x}>{x.replace(/_/g," ")}</option>)}</select>;
  if(s.enum)return wrap(sel(s.enum,v,x=>setAt(path,x)));
  if(s.type==="integer"||s.type==="number")return wrap(<input type="number" value={v??0} onChange={e=>setAt(path,+e.target.value)}/>);
  if(s.type==="string")return wrap(LONG.test(k)?<textarea rows={4} value={v||""} onChange={e=>setAt(path,e.target.value)}/>:<input value={v||""} onChange={e=>setAt(path,e.target.value)}/>);
  if(s.type==="array"){const it=deref(s.items);
   if(it.type==="string")return wrap(<textarea rows={3} placeholder="One per line" value={(v||[]).join("\n")} onChange={e=>setAt(path,e.target.value.split("\n"))}/>);
   return wrap(<>{(v||[]).map((row,r)=><div className="row" key={r}>
    {Object.entries(it.properties).filter(([f])=>f!=="id"&&f!=="trigger").map(([f,fs])=>{const d=deref(fs);
     return d.enum?sel(d.enum,row[f],x=>setAt([...path,r,f],x),f):<input key={f} aria-label={f} placeholder={f.replace(/_/g," ")} value={row[f]??""} onChange={e=>setAt([...path,r,f],d.type==="string"?e.target.value:+e.target.value)}/>})}
    {it.properties.trigger&&<Trig t={row.trigger} on={t=>setAt([...path,r,"trigger"],t)}/>}
    <button className="x" onClick={()=>setAt(path,v.filter((_,j)=>j!==r))}>Remove</button></div>)}
    <button className="ghost" onClick={()=>setAt(path,[...(v||[]),blank(s.items)])}>Add</button></>);}
  return null};
 return Object.entries(schema.properties).filter(([k])=>k!=="artifacts"&&k!=="knowledge").map(([sec,ss])=>{const s=deref(ss);
  return <details key={sec} className="sec" open={sec==="overview"}><summary>{s.title||sec}</summary>
   <div className={sec==="demographics"?"grid":""}>{Object.entries(s.properties).map(([k,fs])=>Field(k,fs,(p[sec]||{})[k],[sec,k]))}</div></details>});
}

function Artifacts({p,setP,up,busy}){
 const [f,setF]=useState({title:"",kind:"lab",ttype:"exam_requested",tvalue:""}),file=useRef();
 const add=()=>{const fd=new FormData();Object.entries(f).forEach(([k,v])=>fd.append(k,v));fd.append("file",file.current.files[0]);up("artifacts",fd).then(()=>{file.current.value="";setF({...f,title:""})})};
 const upd=(i,patch)=>setP({...p,artifacts:p.artifacts.map((a,j)=>j===i?{...a,...patch}:a)});
 return <><h3>Attach an artifact</h3><p className="muted">Images get a drafted findings summary that you confirm below.</p>
  <div className="row"><input placeholder="Title (e.g. 12-lead ECG)" value={f.title} onChange={e=>setF({...f,title:e.target.value})}/>
  <select value={f.kind} onChange={e=>setF({...f,kind:e.target.value})}>{["lab","ecg","xray","ct","note","other"].map(k=><option key={k}>{k}</option>)}</select>
  <Trig t={{type:f.ttype,value:f.tvalue}} on={t=>setF({...f,ttype:t.type,tvalue:t.value||""})}/></div>
  <div className="row"><input type="file" ref={file}/><button disabled={busy||!f.title} onClick={add}>{busy?"Uploading…":"Upload artifact"}</button></div>
  {!p.artifacts.length&&<p className="muted">No artifacts yet.</p>}
  {p.artifacts.map((a,i)=><div className="item" key={a.id}><b>{a.title}</b> <span className="muted">{a.kind}</span> {a.findings&&!(p._verified||[]).includes("art"+a.id)&&<span className="badge ai">AI-drafted findings</span>}
   {/\.(png|jpe?g)$/i.test(a.file_url)&&<img src={a.file_url} alt={a.title} style={{maxHeight:140}}/>}
   <textarea aria-label="Findings summary" rows={2} placeholder="Findings the student will see" value={a.findings} onChange={e=>{upd(i,{findings:e.target.value});}}/>
   <div className="row" style={{marginTop:8}}><Trig t={a.trigger} on={t=>upd(i,{trigger:t})}/><button className="x" onClick={()=>setP({...p,artifacts:p.artifacts.filter((_,j)=>j!==i)})}>Remove</button></div></div>)}</>;
}

function Knowledge({p,up,busy}){
 const file=useRef();
 return <><h3>Knowledge sources</h3><p className="muted">Guidelines, papers, or protocols (PDF or text). The virtual patient is grounded in these during the encounter.</p>
 <div className="row"><input type="file" accept=".pdf,.txt,.md" ref={file}/><button disabled={busy} onClick={()=>{const fd=new FormData();fd.append("file",file.current.files[0]);up("knowledge",fd)}}>{busy?"Indexing…":"Add source"}</button></div>
 {!p.knowledge.length?<p className="muted">No sources yet.</p>:p.knowledge.map((k,i)=><div className="item" key={i}>{k.name} <span className="muted">{k.chunks} passages indexed</span></div>)}</>;
}

function Check({d,check,dismiss,publish,busy,go,save}){
 const iss=d.issues,open=(iss||[]).filter(i=>i.sev==="critical"&&i.status==="open").length;
 return <><div className="row"><button disabled={busy} onClick={check}>{busy?"Working…":"Run consistency check"}</button>
  <button disabled={busy||d.status!=="draft"||iss===null||open>0} onClick={publish}>Approve & publish</button></div>
  {iss===null&&<p className="muted">Run the check before publishing. Editing the profile clears earlier results.</p>}
  {iss&&!iss.length&&<p style={{color:"var(--ok)"}}>No issues found. This profile is ready to publish.</p>}
  {iss&&open>0&&<p className="err">{open} critical issue{open>1?"s":""} must be fixed or dismissed before publishing.</p>}
  {(iss||[]).map((i,n)=><div key={n} className={"issue "+i.sev+" "+i.status}><span className={"badge "+i.sev}>{i.sev}</span> <span className="muted">{i.path} · {i.src==="rule"?"rule check":"AI audit"}</span>
   <div>{i.issue}</div><div className="muted">Suggested fix: {i.fix}</div>{i.src==="llm"&&i.status==="open"&&<button className="ghost" style={{marginTop:6}} onClick={()=>dismiss(n)}>Dismiss as not an issue</button>}</div>)}
  {d.status==="published"&&<p><button onClick={()=>go({n:"enc",pid:d.pid})}>Start encounter</button></p>}<TriggerTest pid={d.pid} save={save}/></>;
}

function Encounter({pid,go,fac}){
 const [p,setP]=useState(null),[chart,setC]=useState(null),[msgs,setM]=useState([]),[txt,setT]=useState(""),[un,setU]=useState([]),[nw,setN]=useState([]),[log,setL]=useState([]),[busy,setB]=useState(false),[e,setE]=useState(""),end=useRef();
 useEffect(()=>{api("/encounter/"+pid).then(x=>{setP(x);setC({vitals:x.vitals,exam:x.exam,artifacts:x.artifacts});setU([...x.vitals,...x.exam,...x.artifacts].map(i=>i.id))}).catch(x=>setE(String(x)))},[pid]);
 useEffect(()=>{end.current&&(end.current.scrollTop=end.current.scrollHeight)},[msgs]);
 if(e)return <p className="err">{e}</p>;if(!p||!chart)return <p className="muted">Loading…</p>;
 const send=async()=>{const m=txt.trim();if(!m)return;setT("");setB(true);setN([]);const hist=msgs,t=hist.filter(x=>x.role==="student").length+1;setM([...hist,{role:"student",content:m}]);
  try{const r=await api(`/encounter/${pid}/turn`,{json:{history:hist,message:m,turn:t,unlocked:un}});
   setM(x=>[...x,{role:"patient",content:r.reply}]);setU(r.unlocked);setN(r.new);
   setC(c=>{const n={...c};r.revealed.forEach(x=>n[x.group]=[...n[x.group],x.item]);return n});
   setL(l=>[...l,...r.revealed.map(x=>({turn:t,label:x.item.label||x.item.title,reason:x.reason}))])}catch(x){setE(String(x))}setB(false)};
 const Item=({i,children})=><div className={"item "+(nw.includes(i.id)?"new":"")}>{children}</div>;
 return <><div style={{display:"flex",gap:12,alignItems:"baseline",marginBottom:12}}><h1>Encounter</h1><span className="muted">Chief complaint on the board: {p.chief_complaint}</span><button className="ghost" style={{marginLeft:"auto"}} onClick={()=>go({n:"lib"})}>End encounter</button></div>
 <div className="enc"><div className="card"><div className="chat" ref={end}>{!msgs.length&&<p className="muted">Greet {p.persona.name} and start the interview.</p>}{msgs.map((m,i)=><div key={i} className={"m "+m.role}>{m.content}</div>)}</div>
  <div className="row"><input aria-label="Your message" value={txt} onChange={e=>setT(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!busy&&send()} placeholder="Ask a question or request an exam or test"/><button disabled={busy} onClick={send}>{busy?"…":"Send"}</button></div></div>
 <div className="card"><h3>Patient chart</h3><p className="muted">{p.persona.name}, {p.persona.age} {p.persona.sex}</p>
  {[["Vitals",chart.vitals],["Exam",chart.exam]].map(([t,a])=><div key={t}><b>{t}</b>{!a.length&&<p className="muted">Nothing yet.</p>}{a.map(i=><Item key={i.id} i={i}>{i.label}: {i.value}</Item>)}</div>)}
  <b>Results & documents</b>{!chart.artifacts.length&&<p className="muted">Nothing yet.</p>}
  {chart.artifacts.map(a=><Item key={a.id} i={a}><b>{a.title}</b><div>{a.findings}</div>{/\.(png|jpe?g)$/i.test(a.file_url)&&<img src={a.file_url} alt={a.title}/>}</Item>)}</div></div>
 {fac&&<details className="sec" style={{marginTop:12}}><summary style={{fontSize:16}}>Release log (faculty only)</summary>{!log.length?<p className="muted">Nothing released yet.</p>:log.map((l,i)=><div key={i} className="item">Turn {l.turn}: <b>{l.label}</b> <span className="muted">released by {l.reason}</span></div>)}</details>}</>;
}
function TriggerTest({pid,save}){
 const [m,setM]=useState(""),[t,setT]=useState(1),[r,setR]=useState(null),[b,setB]=useState(false);
 const run=async()=>{setB(true);try{await save();setR(await api(`/patients/${pid}/test-triggers`,{json:{message:m,turn:+t||1}}))}catch(x){setR(String(x))}setB(false)};
 return <div style={{marginTop:24,borderTop:"1px solid var(--line)",paddingTop:16}}><h3>Test release triggers</h3><p className="muted">Type something a student might say and see which chart items it would release.</p>
 <div className="row"><input aria-label="Sample student message" placeholder="e.g. Can I get a 12-lead ECG?" value={m} onChange={e=>setM(e.target.value)}/><input aria-label="Turn number" type="number" min="1" style={{flex:"0 0 90px"}} value={t} onChange={e=>setT(e.target.value)}/><button disabled={b||!m.trim()} onClick={run}>{b?"Testing…":"Test"}</button></div>
 {typeof r==="string"&&<p className="err">{r}</p>}{Array.isArray(r)&&(!r.length?<p className="muted">Nothing would be released.</p>:r.map((x,i)=><div className="item" key={i}><b>{x.label}</b> <span className="muted">({x.group}) would release via {x.reason}</span></div>))}</div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
